name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Template fill/flatten check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          npm run test:templates

      # prebuild runs the voice tool-sync and UI-error guards. The build needs
      # no secrets: Supabase/OpenAI/Stripe clients are created lazily at
      # request time.
      - name: Build
        run: npm run build
